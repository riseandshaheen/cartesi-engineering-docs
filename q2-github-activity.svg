  </defs>

  <rect width="1100" height="168" fill="#fff"/>
  <rect x="8" y="8" width="1084" height="152" rx="12" fill="#fff" stroke="#00C6D9" stroke-width="2"/>

  <line x1="275" y1="40" x2="275" y2="128" stroke="#00C6D9" stroke-width="1.5"/>
  <line x1="550" y1="40" x2="550" y2="128" stroke="#00C6D9" stroke-width="1.5"/>
  <line x1="825" y1="40" x2="825" y2="128" stroke="#00C6D9" stroke-width="1.5"/>

  <text class="num" x="137.5" y="88">96</text>
  <text class="lbl" x="137.5" y="118">merged pull requests</text>

  <text class="num" x="412.5" y="88">~600</text>
  <text class="lbl" x="412.5" y="118">commits</text>

  <text class="num" x="687.5" y="88">36</text>
  <text class="lbl" x="687.5" y="118">release tags</text>

  <text class="num" x="962.5" y="88">13</text>
