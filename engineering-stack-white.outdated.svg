  <g filter="url(#softShadow)">
    <rect x="306" y="28" width="248" height="112" rx="12" fill="#ffffff" stroke="#008DA5" stroke-width="1.5"/>
  </g>
  <text x="320" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#008DA5" letter-spacing="0.03em">CONTRACTS &amp; FRAUD PROOFS</text>

  <a href="https://github.com/cartesi/rollups-contracts">
    <rect x="320" y="62" width="220" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="430" y="81" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">rollups-contracts</text>
  </a>
  <a href="https://github.com/cartesi/dave">
    <rect x="320" y="96" width="220" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="430" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">dave</text>
  </a>

  <g filter="url(#softShadow)">
    <rect x="306" y="152" width="248" height="80" rx="12" fill="#ffffff" stroke="#008DA5" stroke-width="1.5"/>
  </g>
  <text x="320" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#008DA5" letter-spacing="0.04em">APPLICATION</text>

  <a href="https://github.com/cartesi/honeypot">
    <rect x="320" y="186" width="220" height="28" rx="14" fill="#008DA5"/>
    <text x="430" y="205" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fff">honeypot</text>
  </a>

  <line x1="564" y1="100" x2="584" y2="100" stroke="#008DA5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Col 3 Node -->
  <g filter="url(#softShadow)">
    <rect x="596" y="28" width="248" height="112" rx="12" fill="#ffffff" stroke="#008DA5" stroke-width="1.5"/>
  </g>
  <text x="610" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#008DA5" letter-spacing="0.04em">NODE AND SEQUENCER</text>

  <a href="https://github.com/cartesi/rollups-node">
    <rect x="610" y="62" width="220" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="720" y="81" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">rollups-node</text>
  </a>
  <a href="https://github.com/cartesi/sequencer">
    <rect x="610" y="96" width="220" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="720" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">sequencer</text>
  </a>

  <line x1="854" y1="100" x2="874" y2="100" stroke="#008DA5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Col 4 Docs -->
  <g filter="url(#softShadow)">
    <rect x="886" y="28" width="198" height="204" rx="12" fill="#ffffff" stroke="#008DA5" stroke-width="1.5"/>
  </g>
  <text x="900" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#008DA5" letter-spacing="0.04em">DOCS AND TOOLING</text>

  <a href="https://github.com/cartesi/cli">
    <rect x="900" y="62" width="170" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="985" y="81" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">cli</text>
  </a>
  <a href="https://github.com/cartesi/docs">
    <rect x="900" y="96" width="170" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="985" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">docs</text>
  </a>
  <a href="https://github.com/cartesi/application-templates">
    <rect x="900" y="132" width="170" height="26" rx="13" fill="#008DA5"/>
    <text x="985" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#fff">application-templates</text>
  </a>
  <a href="https://github.com/cartesi/rollups-ts">
    <rect x="900" y="164" width="170" height="26" rx="13" fill="#008DA5"/>
    <text x="985" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#fff">rollups-ts</text>
  </a>
  <a href="https://github.com/cartesi/rollups-explorer">
    <rect x="900" y="196" width="170" height="26" rx="13" fill="#008DA5"/>
    <text x="985" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#fff">rollups-explorer</text>
  </a>
</svg>
