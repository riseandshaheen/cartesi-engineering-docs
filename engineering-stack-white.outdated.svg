<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="248" viewBox="0 0 1100 248" role="img" aria-labelledby="title desc">
  <title id="title">Cartesi engineering stack</title>
  <desc id="desc">Horizontal dependency flow from Cartesi Machine through contracts and fraud proofs, node and sequencer, to docs and tooling. Application sits under contracts.</desc>

  <defs>
    <clipPath id="frame">
      <rect width="1100" height="248" rx="12"/>
    </clipPath>
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#008DA5" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#008DA5"/>
    </marker>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1100" height="248" fill="#ffffff"/>
  </g>

  <!-- Legend -->
  <rect x="16" y="10" width="10" height="10" rx="5" fill="#00F6FF" stroke="#008DA5" stroke-width="1"/>
  <text x="32" y="19" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#4a6b72">core</text>
  <rect x="68" y="10" width="10" height="10" rx="5" fill="#008DA5"/>
  <text x="84" y="19" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#4a6b72">support</text>

  <!-- Col 1 Machine -->
  <g filter="url(#softShadow)">
    <rect x="16" y="28" width="248" height="204" rx="12" fill="#ffffff" stroke="#008DA5" stroke-width="1.5"/>
  </g>
  <text x="30" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#008DA5" letter-spacing="0.04em">CARTESI MACHINE</text>

  <a href="https://github.com/cartesi/machine-emulator">
    <rect x="30" y="62" width="220" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="140" y="81" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">machine-emulator</text>
  </a>
  <a href="https://github.com/cartesi/machine-solidity-step">
    <rect x="30" y="96" width="220" height="28" rx="14" fill="#00F6FF" stroke="#008DA5" stroke-width="1.25"/>
    <text x="140" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#000">machine-solidity-step</text>
  </a>
  <a href="https://github.com/cartesi/machine-guest-tools">
    <rect x="30" y="132" width="220" height="26" rx="13" fill="#008DA5"/>
    <text x="140" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#fff">machine-guest-tools</text>
  </a>
  <a href="https://github.com/cartesi/machine-linux-image">
    <rect x="30" y="164" width="220" height="26" rx="13" fill="#008DA5"/>
    <text x="140" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#fff">machine-linux-image</text>
  </a>
  <a href="https://github.com/cartesi/machine-rootfs-image">
    <rect x="30" y="196" width="220" height="26" rx="13" fill="#008DA5"/>
    <text x="140" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#fff">machine-rootfs-image</text>
  </a>

  <line x1="274" y1="100" x2="294" y2="100" stroke="#008DA5" stroke-width="2" marker-end="url(#arrow)"/>

